service: mtg-playmat
image: cardmagic/mtg-playmat

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_HOST") %>
    options:
      "add-host": host.docker.internal:host-gateway

proxy:
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  host: <%= ENV.fetch("KAMAL_PROXY_HOST") %>
  app_port: 80
  forward_headers: true
  ssl_redirect: false
  healthcheck:
    path: /up
    interval: 3
    timeout: 10

registry:
  server: docker.io
  username: cardmagic
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - HONEYBADGER_API_KEY
  clear:
    SOLID_OBJECTS_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: http://mtg-playmat-jaeger:4318/v1/traces

accessories:
  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    host: <%= ENV.fetch("KAMAL_SERVER_HOST") %>
    port: "127.0.0.1:16686:16686"
    options:
      user: "0"
    env:
      clear:
        COLLECTOR_OTLP_ENABLED: true
        SPAN_STORAGE_TYPE: badger
        BADGER_EPHEMERAL: false
        BADGER_DIRECTORY_VALUE: /badger/data
        BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - mtg-jaeger-data:/badger

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "mtg-playmat-storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://<%= ENV.fetch("KAMAL_SSH_USER", "app") %>@<%= ENV.fetch("KAMAL_SERVER_HOST") %>
  local: true
  cache:
    type: registry

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "app") %>

deploy_timeout: 120
drain_timeout: 30
